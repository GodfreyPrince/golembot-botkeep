# GolemBot config for Botkeep. NEVER put real tokens here —
# they come from the Botkeep panel (Environment), referenced as ${...}.
name: golembot
engine: opencode
model: opencode/deepseek-v4.1-flash-free   # DeepSeek V4.1 Flash, free on OpenCode Zen (limited-time free period)
channels:
  telegram:
    botToken: ${TELEGRAM_BOT_TOKEN}   # from @BotFather on Telegram

gateway:
  port: 23456          # dashboard; bound to localhost only (not reachable on Botkeep — harmless)
  host: 127.0.0.1
