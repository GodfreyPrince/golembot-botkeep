# GolemBot config for Botkeep. NEVER put real tokens here —
# they come from the Botkeep panel (Environment), referenced as ${...}.
name: golembot
engine: opencode
model: opencode/muse-spark-1.3-contributor-free
channels:
  slack:
    botToken: ${SLACK_BOT_TOKEN}   # xoxb-... from Slack app > OAuth & Permissions
    appToken: ${SLACK_APP_TOKEN}   # xapp-... from Slack app > Basic Information > App-Level Tokens

gateway:
  port: 23456          # dashboard; bound to localhost only (not reachable on Botkeep — harmless)
  host: 127.0.0.1
